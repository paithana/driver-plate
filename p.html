:root {
  --bg: #eef1f5; --surface: #ffffff; --fg: #0d1b33; --muted: #4f5b70; --line: #cfd6e1;
  --sign: #12408c; --alarm: #c8102e; --alarm-fg: #ffffff; --warn: #8a4b00;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Thai", "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0b1426; --surface: #13203a; --fg: #e8edf5; --muted: #a3afc4; --line: #2a3a58;
    --sign: #8fb0ee; --alarm: #cf2a40; --warn: #f0b46a; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0b1426; --surface: #13203a; --fg: #e8edf5; --muted: #a3afc4; --line: #2a3a58;
  --sign: #8fb0ee; --alarm: #cf2a40; --warn: #f0b46a; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 17px/1.6 var(--sans); -webkit-text-size-adjust: 100%; }
main { max-width: 520px; margin: 0 auto; padding: 0 max(var(--s4), env(safe-area-inset-right)) var(--s7) max(var(--s4), env(safe-area-inset-left)); }
:focus-visible { outline: 3px solid var(--sign); outline-offset: 2px; }

/* Language strip: one scrolling line, so all 11 languages never push the plate below the fold. */
.langs { position: sticky; top: 0; z-index: 2; display: flex; gap: var(--s2); overflow-x: auto; scrollbar-width: none;
  margin: 0 calc(-1 * max(var(--s4), env(safe-area-inset-left))); padding: max(var(--s3), env(safe-area-inset-top)) var(--s4) var(--s3);
  background: var(--bg); -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--s4), #000 calc(100% - var(--s6)), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 var(--s4), #000 calc(100% - var(--s6)), transparent); }
.langs::-webkit-scrollbar { display: none; }
.langs button { flex: none; font: inherit; font-size: 15px; line-height: 1; min-height: 40px; padding: 0 var(--s4); border-radius: 20px;
  border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--sign); border-color: var(--sign); color: var(--surface); font-weight: 700; }

h1 { font-size: 28px; line-height: 1.25; margin: var(--s4) 0 var(--s1); }
.lead { margin: 0 0 var(--s5); color: var(--muted); max-width: 40ch; }

/* The plate: proportions of a Thai plate (34 × 15 cm), registration on top, province below, as on the car. */
.plate { margin: 0 0 var(--s5); }
.plate-face { width: min(100%, 360px); aspect-ratio: 34 / 15; display: grid; grid-template-rows: 1.55fr 1fr; place-items: center;
  padding: 4% 6% 5%; background: #fff; color: #000; border: 3px solid #000; border-radius: 10px;
  box-shadow: inset 0 0 0 4px #fff, inset 0 0 0 5.5px #000, 0 14px 28px -16px rgba(13, 27, 51, .55); container-type: inline-size; }
.plate-no { font: 400 clamp(40px, 21cqw, 80px)/1 'Plate', var(--sans); letter-spacing: .02em; white-space: nowrap; align-self: end; }
.plate-no.long { font-size: clamp(30px, 15cqw, 60px); }
.plate-no .th { font: 800 .74em/1 var(--sans); }   /* Thai letters: no plate face covers them, so match its weight instead */
.plate-prov { font: 700 clamp(18px, 9cqw, 32px)/1.2 var(--sans); white-space: nowrap; }
.plate figcaption { margin-top: var(--s2); font-size: 15px; color: var(--muted); }

.facts { margin: 0; display: grid; gap: var(--s4); }
.facts div { display: grid; gap: 2px; }
.facts dt { font-size: 14px; color: var(--muted); }
.facts dd { margin: 0; font-size: 23px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }

h2 { font-size: 19px; line-height: 1.35; margin: var(--s7) 0 var(--s3); }
.calls { display: grid; gap: var(--s2); padding: 0; margin: 0; list-style: none; }
.calls a { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: var(--s4); min-height: 60px; padding: var(--s2) var(--s4);
  border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; line-height: 1.35; }
.calls .num { font: 400 28px/1 'Plate', var(--sans); color: var(--sign); letter-spacing: .02em; }
.calls li:first-child a { background: var(--alarm); border-color: var(--alarm); color: var(--alarm-fg); font-weight: 700; }
.calls li:first-child .num { color: var(--alarm-fg); }
@media (hover: hover) { .calls a:hover { border-color: var(--sign); } .calls li:first-child a:hover { filter: brightness(1.08); } }

.tip { margin: var(--s5) 0 0; font-size: 15px; }
.note { margin: var(--s2) 0 0; font-size: 14px; color: var(--muted); }
.note a { color: var(--sign); text-underline-offset: 3px; }
.bad { margin: 0 0 var(--s5); padding: var(--s4); border: 1.5px solid var(--warn); border-radius: 12px; color: var(--warn); }
