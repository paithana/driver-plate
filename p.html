<style>
/* Passenger page opened from the QR on a driver's card. Driver details arrive in the URL fragment (#…), which never reaches the server. */
:root {
  --bg: #faf9f6; --surface: #ffffff; --fg: #1f2a1e; --muted: #5c6553; --accent: #2d4a2b; --accent-fg: #faf9f6;
  --olive: #a4ac86; --line: #d3d7c6; --warn: #8a5a1c;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #151d14; --surface: #1d281c; --fg: #ecefe5; --muted: #aab3a0; --accent: #a4ac86; --accent-fg: #151d14; --olive: #b9c0a0; --line: #35422f; --warn: #e3b77a; color-scheme: dark; }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", "Noto Sans Thai", "Noto Sans CJK SC", "PingFang SC", "Hiragino Sans", sans-serif; -webkit-text-size-adjust: 100%; }
main { max-width: 560px; margin: 0 auto; padding: max(var(--s5), env(safe-area-inset-top)) max(var(--s4), env(safe-area-inset-right)) var(--s6) max(var(--s4), env(safe-area-inset-left)); }
.langs { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s5); }
.langs button { font: inherit; font-size: 14px; padding: 6px 12px; min-height: 36px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); cursor: pointer; }
.langs button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); font-weight: 700; }
h1 { font-size: 30px; line-height: 1.2; margin: 0 0 var(--s2); color: var(--accent); }
.lead { margin: 0 0 var(--s5); color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: var(--s4) var(--s5); display: grid; gap: var(--s4); box-shadow: 0 10px 30px rgba(45,74,43,.10); }
.row { display: grid; gap: 2px; }
.k { font-size: 13px; color: var(--muted); }
.v { font-size: 22px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; }
.plate { display: inline-grid; justify-items: center; justify-self: start; padding: 4px 16px; border: 3px solid #111; border-radius: 8px; background: #fbfbf7; color: #111; }
.plate b { font-size: 28px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.plate span { font-size: 14px; font-weight: 700; }
h2 { font-size: 18px; margin: var(--s6) 0 var(--s3); }
.calls { display: grid; gap: var(--s2); padding: 0; margin: 0; list-style: none; }
.calls a { display: flex; align-items: center; justify-content: space-between; gap: var(--s3); min-height: 56px; padding: var(--s2) var(--s4);
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); text-decoration: none; }
.calls a:hover { border-color: var(--accent); }
.calls .num { flex: none; font-size: 22px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.calls .num::before { content: "☎ "; font-size: 16px; }
.tip, .note { font-size: 14px; color: var(--muted); margin: var(--s4) 0 0; }
.note a { color: var(--accent); }
.bad { padding: var(--s4); border: 1px solid var(--warn); border-radius: 12px; color: var(--warn); }
[dir="rtl"] .calls a { flex-direction: row-reverse; }
</style>
