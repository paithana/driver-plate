/* Layout: a two-pane workbench — form on the left, the live card on the right; on phones the card docks
   to the top of the screen while the form scrolls under it.
   Theme: Forest Canopy (forest green, sage, olive, ivory); Taviraj serif for headings, Sarabun for everything else. */
:root {
  --bg: #faf9f6;          /* ivory */
  --surface: #ffffff;
  --fg: #1f2a1e;
  --muted: #5c6553;
  --accent: #2d4a2b;      /* forest green */
  --accent-fg: #faf9f6;
  --sage: #7d8471;
  --olive: #a4ac86;
  --line: #d3d7c6;
  --field: #ffffff;
  --card-shadow: 0 10px 30px rgba(45, 74, 43, 0.14);
  --dock-shadow: 0 8px 22px rgba(31, 42, 30, 0.18);
  --ok: #2f6b3a;
  --warn: #8a5a1c;
  --font-display: 'Taviraj', 'Tinos', Georgia, 'Times New Roman', serif;
  --font-body: 'Sarabun', 'Noto Sans Thai', 'Leelawadee UI', Tahoma, system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151d14; --surface: #1d281c; --fg: #ecefe5; --muted: #aab3a0;
    --accent: #a4ac86; --accent-fg: #151d14; --sage: #8d957f; --olive: #b9c0a0;
    --line: #35422f; --field: #16201a; --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    --dock-shadow: 0 8px 22px rgba(0, 0, 0, 0.5); --ok: #9fd3a6; --warn: #e3b77a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151d14; --surface: #1d281c; --fg: #ecefe5; --muted: #aab3a0;
  --accent: #a4ac86; --accent-fg: #151d14; --sage: #8d957f; --olive: #b9c0a0;
  --line: #35422f; --field: #16201a; --card-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
  --dock-shadow: 0 8px 22px rgba(0, 0, 0, 0.5); --ok: #9fd3a6; --warn: #e3b77a; color-scheme: dark;
}

/* Type + spacing system. Thai stacks tone marks above and vowels below the line, so body copy runs at
   line-height ≥ 1.6, nothing Thai goes below 13px, and letter-spacing is only applied to Latin runs (.latin). */
:root {
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 24px; --s6: 32px; --s7: 48px;
  --t-xs: 13px; --t-sm: 14px; --t-md: 16px; --t-lg: 18px; --t-xl: 21px;
  --t-h1: clamp(32px, 2.2rem + 1.4vw, 50px);
  --lh-tight: 1.2; --lh-body: 1.65;
  --r-sm: 8px; --r-md: 12px; --r-lg: 16px;
  --control-h: 46px;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font: 400 var(--t-md)/var(--lh-body) var(--font-body);
  -webkit-text-size-adjust: 100%; text-rendering: optimizeLegibility; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.latin { letter-spacing: 0.02em; }
.page {
  max-width: 1200px; margin: 0 auto; padding-block: var(--s6) var(--s7);
  padding-left: max(var(--s5), env(safe-area-inset-left, 0px));
  padding-right: max(var(--s5), env(safe-area-inset-right, 0px));
}

/* Masthead */
.masthead { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: var(--s4) var(--s6);
  padding-bottom: var(--s5); margin-bottom: var(--s6); position: relative; }
.masthead::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; border-radius: 3px; opacity: .9;
  background: repeating-linear-gradient(90deg, var(--accent) 0 42px, var(--olive) 42px 50px, transparent 50px 58px); }
.eyebrow { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--s2); margin: 0 0 var(--s2);
  font-size: var(--t-sm); font-weight: 700; color: var(--sage); line-height: 1.4; }
.eyebrow .latin { font-size: var(--t-xs); letter-spacing: 0.14em; text-transform: uppercase; }
.eyebrow .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--olive); align-self: center; }
h1 { font: 700 var(--t-h1)/1.12 var(--font-display); margin: 0; text-wrap: balance; color: var(--accent); }
.lede { margin: var(--s3) 0 0; font-size: var(--t-lg); line-height: 1.6; color: var(--muted); max-width: 46ch; text-wrap: pretty; }
.plate { display: grid; justify-items: center; min-width: 176px; padding: var(--s2) var(--s5) 6px; background: #fbfbf7; color: #111;
  border: 3px solid #111; border-radius: 10px; transform: rotate(-1.5deg);
  box-shadow: inset 0 0 0 3px #fbfbf7, inset 0 0 0 4.5px #111, 0 6px 16px rgba(31,42,30,.16); }
.plate-no { white-space: nowrap; font: 400 36px/1 Anton, Impact, 'Arial Narrow', sans-serif; letter-spacing: .04em; font-variant-numeric: tabular-nums; }
.plate-prov { font: 700 var(--t-md)/1.35 var(--font-body); }

/* Two-pane layout */
.layout { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); gap: var(--s6) var(--s7); align-items: start; }
.form { display: grid; gap: var(--s5); grid-column: 1; grid-row: 1; min-width: 0; counter-reset: step; }
.right { display: grid; gap: var(--s4); min-width: 0; grid-column: 2; grid-row: 1; }
:root { --bar-h: 0px; }
:root.bar-on { --bar-h: 52px; }
.stickybar { position: fixed; top: env(safe-area-inset-top, 0px); left: 0; right: 0; z-index: 20; height: 52px;
  background: var(--bg); box-shadow: 0 4px 14px -10px rgba(31,42,30,.35);
  border-bottom: 1px solid var(--line); transform: translateY(-110%); transition: transform .2s ease; }
.stickybar.on { transform: none; }
.stickybar-in { max-width: 1200px; height: 100%; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--s4);
  padding-left: max(var(--s5), env(safe-area-inset-left, 0px)); padding-right: max(var(--s5), env(safe-area-inset-right, 0px)); }
.sb-title { font: 700 var(--t-xl)/1.2 var(--font-display); color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.sb-plate { flex: none; padding: 2px var(--s3); border: 2px solid #111; border-radius: 6px; background: #fbfbf7; color: #111;
  font: 700 var(--t-sm)/1.4 var(--font-body); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (min-width: 861px) { .right { position: sticky; top: calc(var(--bar-h) + var(--s5)); transition: top .2s ease; } }

/* Sections */
fieldset { border: 1px solid var(--line); border-radius: var(--r-md); margin: 0; min-width: 0; background: var(--surface);
  padding: var(--s3) var(--s5) var(--s5); display: grid; gap: var(--s4); transition: border-color .2s; }
fieldset:focus-within { border-color: var(--olive); }
legend { display: flex; align-items: center; gap: var(--s3); padding: 0 var(--s2); margin-left: calc(-1 * var(--s2));
  font: 700 var(--t-xl)/var(--lh-tight) var(--font-display); color: var(--accent); }
legend::before { counter-increment: step; content: counter(step); display: inline-grid; place-items: center; width: 28px; height: 28px;
  border-radius: 50%; background: var(--accent); color: var(--accent-fg); font: 700 var(--t-sm)/1 var(--font-body); }

/* Fields */
.field { display: grid; gap: 6px; min-width: 0; }
.lab { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 var(--s2); font-size: var(--t-md); font-weight: 700; line-height: 1.4; }
.lab .en { font-size: var(--t-xs); font-weight: 400; color: var(--muted); letter-spacing: 0.02em; }
.hint { font-size: var(--t-xs); line-height: 1.55; color: var(--muted); }
input[type="text"], textarea, select {
  width: 100%; min-width: 0; min-height: var(--control-h); padding: 10px 14px;
  font: 400 var(--t-md)/1.45 var(--font-body); color: var(--fg); background: var(--field);
  border: 1px solid var(--line); border-radius: var(--r-sm); transition: border-color .15s, box-shadow .15s;
}
textarea { resize: vertical; min-height: 64px; }
input[type="text"]:focus, textarea:focus, select:focus { border-color: var(--accent); outline: none;
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--olive) 35%, transparent); }
button:focus-visible, input[type="range"]:focus-visible, input[type="checkbox"]:focus-visible, input[type="radio"]:focus-visible {
  outline: 2px solid var(--olive); outline-offset: 2px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); }
.row > * { min-width: 0; }

/* Photo + sliders */
.photo-tools { display: grid; gap: var(--s4); }
.photo-actions { display: flex; flex-wrap: wrap; gap: var(--s2) var(--s3); align-items: center; }
.sliders { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--s4); }
.sliders.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.slider { display: grid; gap: var(--s1); font-size: var(--t-sm); color: var(--muted); }
.slider input { width: 100%; margin: 0; height: 28px; accent-color: var(--accent); }
.slider output { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--fg); }
.bg-tools { display: grid; gap: var(--s2); padding-top: var(--s3); border-top: 1px dashed var(--line); }
.swatches { display: flex; flex-wrap: wrap; gap: var(--s2); align-items: center; }
.swatch { display: inline-flex; align-items: center; gap: var(--s2); min-height: 40px; padding: 0 var(--s3) 0 var(--s2); cursor: pointer;
  font: 400 var(--t-sm)/1.2 var(--font-body); color: var(--fg); background: var(--field); border: 1px solid var(--line); border-radius: 999px; }
.swatch .chip { width: 24px; height: 24px; border-radius: 50%; border: 1px solid rgba(0,0,0,.18); }
.swatch.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--olive) 45%, transparent); font-weight: 700; }
input[type="file"] { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }

/* Buttons + choices */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--s2); min-height: var(--control-h);
  padding: 0 var(--s5); border-radius: var(--r-sm); cursor: pointer; font: 700 var(--t-md)/1.2 var(--font-body);
  border: 1px solid var(--accent); background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.primary:hover:not([disabled]) { background: color-mix(in srgb, var(--accent) 86%, #000); }
.btn:not(.primary):hover:not([disabled]) { background: color-mix(in srgb, var(--olive) 16%, transparent); }
.btn.small { min-height: 40px; padding: 0 var(--s4); font-size: var(--t-sm); }
.btn.quiet { border-color: var(--line); color: var(--muted); }
.btn[disabled] { opacity: 0.55; cursor: wait; }
.check { display: flex; gap: var(--s3); align-items: center; min-height: 40px; font-size: var(--t-md); line-height: 1.45; }
.check input { flex: none; width: 20px; height: 20px; margin: 0; accent-color: var(--accent); }

/* Preview */
.card-wrap { border-radius: var(--r-lg); padding: var(--s4); box-shadow: var(--card-shadow); border: 1.5px solid transparent;
  background: linear-gradient(var(--surface), var(--surface)) padding-box,
              linear-gradient(135deg, var(--olive), var(--line) 40%, var(--accent)) border-box; }
.card-wrap canvas { display: block; width: 100%; height: auto; max-width: 100%; background: #fff; border: 1px solid #d9dcd2;
  border-radius: 3px; box-shadow: 0 1px 0 #d9dcd2, 0 12px 24px -12px rgba(31,42,30,.35); }
.caption { display: flex; justify-content: space-between; flex-wrap: wrap; gap: var(--s1) var(--s3); margin-top: var(--s3);
  font-size: var(--t-xs); color: var(--muted); }
.only-phone { display: none; }
.actions { display: flex; flex-wrap: wrap; gap: var(--s3); align-items: center; margin-top: var(--s4); padding-top: var(--s4); border-top: 1px solid var(--line); }
.card-wrap .status { margin-top: var(--s3); }
.card-wrap .status.empty { display: none; }
.btn.quiet.confirm { border-color: var(--warn); color: var(--warn); }
.status { margin: 0; min-height: 1.6em; font-size: var(--t-sm); color: var(--muted); }
.status.ok { color: var(--ok); }
.status.warn { color: var(--warn); }
.result { margin: 0; display: grid; gap: var(--s3); padding: var(--s4); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-md); }
.result img { display: block; width: 100%; height: auto; max-width: 100%; border: 1px solid #d9dcd2; background: #fff; }
.result figcaption { display: flex; flex-wrap: wrap; gap: var(--s1) var(--s4); font-size: var(--t-xs); color: var(--muted); }
.result b { color: var(--fg); font-variant-numeric: tabular-nums; }

/* Footer */
.foot { margin-top: var(--s7); padding-top: var(--s5); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap;
  justify-content: space-between; gap: var(--s2) var(--s5); font-size: var(--t-sm); line-height: 1.6; color: var(--muted); }
.foot p { margin: 0; max-width: 64ch; }
.foot-notes { display: grid; gap: var(--s2); }
.ad-slot { margin-top: var(--s7); padding: var(--s3) var(--s4) var(--s4); border: 1px dashed var(--line); border-radius: var(--r-md); display: grid; gap: var(--s2); }
.ad-label { font-size: var(--t-xs); color: var(--muted); }
.ad-slot:has(ins[data-ad-status="unfilled"]) { display: none; }
.ad-slot + .foot { margin-top: var(--s6); }
.foot b { color: var(--accent); }
.foot-meta { display: grid; gap: var(--s1); justify-items: end; text-align: right; }
.powered { font-size: var(--t-xs); }
.powered a { color: var(--accent); font-weight: 700; text-decoration-thickness: 1px; text-underline-offset: 3px; }
@media (max-width: 860px) { .foot-meta { justify-items: start; text-align: left; } }
.printsheet { display: none; }

/* Phones: the card docks to the top while the form scrolls under it. */
@media (max-width: 860px) {
  :root { --t-xl: 19px; --t-h1: 30px; }
  .page { padding-top: var(--s5); padding-left: max(var(--s4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s4), env(safe-area-inset-right, 0px)); }
  .masthead { align-items: start; gap: var(--s3); margin-bottom: var(--s5); padding-bottom: var(--s4); }
  .lede { font-size: var(--t-md); margin-top: var(--s2); }
  .plate { min-width: 0; transform: none; grid-auto-flow: column; align-items: baseline; justify-items: start; gap: var(--s3); padding: var(--s1) var(--s3); }
  .plate-no { font-size: 24px; }
  .plate-prov { font-size: var(--t-sm); }
  .layout { display: block; }
  .right { display: contents; }
  :root.bar-on { --bar-h: 44px; }
  .stickybar { height: 44px; }
  .stickybar-in { padding-left: max(var(--s4), env(safe-area-inset-left, 0px)); padding-right: max(var(--s4), env(safe-area-inset-right, 0px)); }
  .sb-title { font-size: var(--t-lg); }
  .card-wrap { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--bar-h)); z-index: 5; display: grid; justify-items: center; gap: 6px;
    padding: var(--s2) var(--s3); border-radius: 0 0 var(--r-lg) var(--r-lg); box-shadow: var(--dock-shadow); }
  .card-view { display: grid; justify-items: center; gap: 6px; width: 100%; cursor: zoom-in; }
  .card-wrap.expanded .card-view { cursor: zoom-out; }
  .card-wrap canvas { width: auto; max-height: 22vh; }
  .card-wrap.expanded canvas { max-height: 52vh; }
  .caption { width: 100%; margin-top: 0; }
  .only-phone { display: inline; }
  .only-desk { display: none; }
  .actions { width: 100%; flex-wrap: nowrap; gap: var(--s2); margin-top: var(--s2); padding-top: var(--s2); }
  .actions .btn { flex: 1 1 0; min-width: 0; min-height: 40px; padding: 0 var(--s2); font-size: var(--t-sm); }
  .actions .btn.primary { flex-grow: 1.4; }
  .card-wrap .status { width: 100%; margin-top: var(--s1); font-size: var(--t-xs); line-height: 1.4; text-align: center; }
  .result { margin-top: var(--s3); }
  .form { margin-top: var(--s5); gap: var(--s4); }
  fieldset { padding: var(--s2) var(--s4) var(--s4); }
  .sliders, .sliders.two { grid-template-columns: 1fr; gap: var(--s3); }
  .foot { margin-top: var(--s6); }
}
@media (max-width: 380px) { .row { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: no-preference) { .btn { transition: background-color .15s, color .15s; } }
@media (prefers-reduced-motion: reduce) { fieldset, input, textarea, select, .stickybar, .right { transition: none; } }
@media print {
  @page { size: A4 landscape; margin: 8mm; }
  body { background: #fff; }
  body::before { display: none; }
  .page, .stickybar { display: none; }
  .printsheet { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; }

}
